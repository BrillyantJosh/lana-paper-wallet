server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compress on the wire. The stock nginx image ships gzip commented out, and
    # this app now serves 1.1 MB of TTF for the printed package on top of the JS.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/ttf;

    # Vite content-hashes every filename under /assets, so a new build is a new
    # URL and these may be cached for good.
    #
    # "^~" is load-bearing: without it the regex block below would win, because
    # nginx prefers a matching regex location over a plain prefix one.
    #
    # An add_header inside a location REPLACES the inherited list rather than
    # adding to it, so the security headers have to be repeated in every block —
    # otherwise scripts and images would be served without nosniff.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The ornaments, the fonts and the emblem keep their names across rebuilds,
    # so they get a day, not a year: a re-engraved ornament must not sit in
    # someone's browser until next September.
    location ~* \.(png|jpe?g|gif|ico|svg|ttf|woff2?|eot)$ {
        # This image's mime.types has no .ttf entry, so the fonts would go out as
        # application/octet-stream — outside gzip_types — and cross the wire raw.
        # default_type only fills in where the extension maps to nothing, so the
        # images are unaffected.
        default_type font/ttf;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
